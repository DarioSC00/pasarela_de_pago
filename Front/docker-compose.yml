version: '3.8'

services:
  formapro-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: formapro-dashboard
    ports:
      - "3000:3000"
    restart: always
    environment:
      # Recuerda pasar aquí las variables de entorno necesarias en producción
      - NODE_ENV=production
      # - NEXT_PUBLIC_SUPABASE_URL=...
      # - NEXT_PUBLIC_SUPABASE_ANON_KEY=...
      # - NEXT_PUBLIC_N8N_WEBHOOK_URL=...
